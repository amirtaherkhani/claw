name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Core and CLI (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos:
    name: Core, CLI and app (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (includes ClawApp)
        run: swift build
      - name: Test
        run: swift test

  macos-ui:
    name: App and UI tests (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: UI tests
        run: xcodebuild -project Claw.xcodeproj -scheme Claw -destination 'platform=macOS' test
